[auth]
site_url = "https://lhyzs-hub.github.io/lhyzs/"
additional_redirect_urls = [
  "https://lhyzs-hub.github.io/lhyzs/admin/comments/",
  "http://127.0.0.1:8000/admin/comments/",
  "http://localhost:8000/admin/comments/",
  "http://127.0.0.1:8000/lhyzs/admin/comments/",
  "http://localhost:8000/lhyzs/admin/comments/",
]

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 600

[auth.email.template.magic_link]
subject = "lhyzs 评论通知登录验证码"
content_path = "./supabase/templates/comment_admin_otp.html"

[auth.email.template.confirmation]
subject = "lhyzs 评论通知登录验证码"
content_path = "./supabase/templates/comment_admin_otp.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.public-submit]
verify_jwt = false
