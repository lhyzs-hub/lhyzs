<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950">
<defs><style>.bg{fill:#11171d}.w{stroke:#eef6fa;stroke-width:4;fill:none}.g{stroke:#75df91;stroke-width:4;fill:none}.box{fill:#18232c;stroke:#eef6fa;stroke-width:3;rx:12}.reg{fill:#193523;stroke:#75df91;stroke-width:3;rx:10}.t{font:21px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#eef6fa}.h{font:700 27px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#fff}.title{font:700 38px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#fff}.s{font:17px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#b8c9d2}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#eef6fa"/></marker></defs>
<rect width="1700" height="950" class="bg"/><text x="850" y="58" text-anchor="middle" class="title">GPIO 数字输入与模拟输入内部电路</text>
<text x="1500" y="120" class="h">VDD</text><path d="M1525 135V220" class="w"/><polyline points="1495,220 1555,220 1495,245 1555,270 1495,295 1555,320 1525,340" class="w"/><rect x="1395" y="340" width="260" height="85" class="reg"/><text x="1525" y="375" text-anchor="middle" class="h">上拉开关</text><text x="1525" y="407" text-anchor="middle" class="s">输入上拉模式接通</text><path d="M1525 425V500" class="g"/>
<text x="1580" y="850" class="h">GND</text><path d="M1525 805V825M1485 825H1565M1498 842H1552M1510 858H1540" class="w"/><polyline points="1525,765 1495,745 1555,720 1495,695 1555,670 1495,645 1525,625" class="w"/><rect x="1395" y="515" width="260" height="85" class="reg"/><text x="1525" y="550" text-anchor="middle" class="h">下拉开关</text><text x="1525" y="582" text-anchor="middle" class="s">输入下拉模式接通</text><path d="M1525 500V515M1525 600V625" class="g"/>
<rect x="1180" y="445" width="180" height="110" class="box"/><text x="1270" y="486" text-anchor="middle" class="h">PAD 引脚</text><text x="1270" y="525" text-anchor="middle" class="s">外部真实电压</text><path d="M1360 500H1525" class="w"/><path d="M1180 500H1080" class="w" marker-end="url(#a)"/>
<path d="M1270 445V315" class="w"/><polygon points="1248,360 1292,360 1270,320" fill="none" stroke="#eef6fa" stroke-width="3"/><text x="1310" y="350" class="s">到 VDD 的保护路径</text><path d="M1270 555V690" class="w"/><polygon points="1248,640 1292,640 1270,680" fill="none" stroke="#eef6fa" stroke-width="3"/><text x="1310" y="675" class="s">到 GND 的保护路径</text>
<rect x="765" y="405" width="315" height="190" class="box"/><text x="922" y="450" text-anchor="middle" class="h">施密特触发输入缓冲</text><path d="M825 485Q905 420 990 485Q905 550 825 485Z" fill="none" stroke="#eef6fa" stroke-width="4"/><path d="M860 470H900V500H950" class="w"/><text x="922" y="570" text-anchor="middle" class="s">迟滞阈值提高数字输入抗噪能力</text><path d="M765 500H700" class="w"/>
<rect x="415" y="250" width="245" height="105" class="reg"/><text x="537" y="292" text-anchor="middle" class="h">GPIOx_IDR[x]</text><text x="537" y="327" text-anchor="middle" class="s">软件读取数字电平</text><path d="M700 500V302H660" class="w" marker-end="url(#a)"/>
<rect x="415" y="425" width="245" height="105" class="reg"/><text x="537" y="467" text-anchor="middle" class="h">EXTI / 边沿检测</text><text x="537" y="502" text-anchor="middle" class="s">数字输入事件路径</text><path d="M700 500V477H660" class="w" marker-end="url(#a)"/>
<rect x="415" y="600" width="245" height="105" class="reg"/><text x="537" y="642" text-anchor="middle" class="h">外设复用输入</text><text x="537" y="677" text-anchor="middle" class="s">USART RX / TIM CHx / SPI</text><path d="M700 500V652H660" class="w" marker-end="url(#a)"/>
<rect x="765" y="675" width="315" height="105" class="box"/><text x="922" y="717" text-anchor="middle" class="h">模拟开关</text><text x="922" y="752" text-anchor="middle" class="s">Analog 模式连接 ADC，关闭数字缓冲</text><path d="M1180 525H1125V727H1080" class="g" marker-end="url(#a)"/>
<rect x="415" y="750" width="245" height="105" class="reg"/><text x="537" y="792" text-anchor="middle" class="h">ADC 采样保持</text><text x="537" y="827" text-anchor="middle" class="s">模拟电压 → 数字结果</text><path d="M765 727H660V802" class="g" marker-end="url(#a)"/>
<rect x="65" y="155" width="280" height="620" class="box"/><text x="205" y="200" text-anchor="middle" class="h">模式决定路径</text><text x="95" y="255" class="t">浮空输入</text><text x="95" y="288" class="s">数字缓冲开，上下拉断</text><text x="95" y="355" class="t">上拉/下拉输入</text><text x="95" y="388" class="s">数字缓冲开，接通弱电阻</text><text x="95" y="455" class="t">模拟输入</text><text x="95" y="488" class="s">数字缓冲关，接通 ADC</text><text x="95" y="555" class="t">复用输入</text><text x="95" y="588" class="s">数字电平送到外设</text><text x="95" y="655" class="t">重要结论</text><text x="95" y="690" class="s">内部上下拉只定默认状态</text><text x="95" y="720" class="s">不能给负载供电</text>
<text x="850" y="910" text-anchor="middle" class="s">保护结构仅为功能示意；5 V 容忍、钳位条件与最大注入电流必须查具体器件数据手册。</text>
</svg>
