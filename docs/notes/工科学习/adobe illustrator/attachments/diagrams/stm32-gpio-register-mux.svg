<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950">
<defs><style>.bg{fill:#11171d}.w{stroke:#eef6fa;stroke-width:4;fill:none}.g{stroke:#79e094;stroke-width:4;fill:none}.box{fill:#18232c;stroke:#eef6fa;stroke-width:3;rx:12}.reg{fill:#193523;stroke:#79e094;stroke-width:3;rx:10}.t{font:21px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#eef6fa}.h{font:700 27px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#fff}.title{font:700 38px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#fff}.s{font:17px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#b8c9d2}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#eef6fa"/></marker></defs>
<rect width="1700" height="950" class="bg"/><text x="850" y="58" text-anchor="middle" class="title">GPIO 寄存器、复用器与引脚信号路径</text>
<rect x="55" y="120" width="230" height="690" class="box"/><text x="170" y="165" text-anchor="middle" class="h">APB2 总线</text><text x="95" y="220" class="t">CPU/HAL 写寄存器</text><text x="95" y="265" class="t">RCC 开 GPIO 时钟</text><path d="M285 320H350" class="w" marker-end="url(#a)"/>
<rect x="350" y="125" width="270" height="140" class="reg"/><text x="485" y="170" text-anchor="middle" class="h">CRL / CRH</text><text x="485" y="210" text-anchor="middle" class="t">MODE + CNF</text><text x="485" y="245" text-anchor="middle" class="s">模式、输出类型、速度</text>
<rect x="350" y="315" width="270" height="130" class="reg"/><text x="485" y="358" text-anchor="middle" class="h">ODR</text><text x="485" y="398" text-anchor="middle" class="t">输出数据锁存</text><text x="485" y="430" text-anchor="middle" class="s">保存目标输出状态</text>
<rect x="350" y="490" width="270" height="130" class="reg"/><text x="485" y="533" text-anchor="middle" class="h">BSRR / BRR</text><text x="485" y="573" text-anchor="middle" class="t">原子置位 / 复位</text><text x="485" y="605" text-anchor="middle" class="s">修改 ODR 指定位</text>
<rect x="350" y="670" width="270" height="110" class="reg"/><text x="485" y="713" text-anchor="middle" class="h">IDR</text><text x="485" y="753" text-anchor="middle" class="t">读取 PAD 实际电平</text>
<path d="M285 380H350M285 555H350M285 725H350" class="w"/>
<rect x="700" y="135" width="330" height="125" class="box"/><text x="865" y="180" text-anchor="middle" class="h">外设输出信号</text><text x="865" y="220" text-anchor="middle" class="s">TIM PWM / USART TX / SPI</text>
<path d="M620 380H745" class="w"/><path d="M865 260V315H745" class="w"/>
<polygon points="745,315 875,350 745,405" fill="#18232c" stroke="#eef6fa" stroke-width="4"/><text x="790" y="367" class="h">MUX</text><path d="M875 360H1010" class="w" marker-end="url(#a)"/><text x="865" y="445" text-anchor="middle" class="s">CRL/CRH 的 CNF 选择 ODR 或外设</text><path d="M485 265V295H810V330" class="g"/>
<rect x="1010" y="275" width="270" height="180" class="box"/><text x="1145" y="320" text-anchor="middle" class="h">输出驱动</text><text x="1145" y="362" text-anchor="middle" class="t">推挽 / 开漏</text><text x="1145" y="402" text-anchor="middle" class="t">2 / 10 / 50 MHz 速度</text><path d="M1280 365H1400" class="w" marker-end="url(#a)"/>
<rect x="1400" y="305" width="230" height="120" class="box"/><text x="1515" y="350" text-anchor="middle" class="h">外部 PAD</text><text x="1515" y="390" text-anchor="middle" class="s">引脚实际电压</text>
<path d="M1515 425V650H1280" class="w" marker-end="url(#a)"/>
<rect x="1010" y="575" width="270" height="150" class="box"/><text x="1145" y="620" text-anchor="middle" class="h">数字输入缓冲</text><text x="1145" y="662" text-anchor="middle" class="t">施密特触发器</text><text x="1145" y="700" text-anchor="middle" class="s">Analog 模式下关闭</text><path d="M1010 650H790V725H620" class="w" marker-end="url(#a)"/>
<path d="M1145 725V800H865" class="w"/><rect x="730" y="800" width="270" height="105" class="box"/><text x="865" y="842" text-anchor="middle" class="h">外设输入 / EXTI</text><text x="865" y="880" text-anchor="middle" class="t">USART RX / TIM / 边沿检测</text>
<rect x="1020" y="790" width="600" height="115" class="box"/><text x="1320" y="833" text-anchor="middle" class="t">ODR：软件希望输出的值</text><text x="1320" y="873" text-anchor="middle" class="t">IDR：经过输入缓冲读取到的 PAD 实际值</text>
</svg>
