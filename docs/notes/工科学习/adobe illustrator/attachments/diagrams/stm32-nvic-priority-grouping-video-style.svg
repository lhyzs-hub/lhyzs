<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#080b0f"/>
  <rect x="28" y="28" width="1544" height="844" rx="18" fill="#0c1117" stroke="#e8edf2" stroke-width="3"/>
  <text x="800" y="82" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="700" font-family="Microsoft YaHei">STM32F1 嵌套向量中断控制器（NVIC）：4个有效优先级位</text>
  <text x="800" y="124" text-anchor="middle" fill="#a8b6c4" font-size="23" font-family="Microsoft YaHei">数值越小，逻辑优先级越高；分组对所有可配置中断统一生效</text>

  <text x="70" y="195" fill="#ffffff" font-size="24" font-family="Microsoft YaHei">中断优先级寄存器（IPR）</text>
  <g font-family="Consolas" font-size="24" text-anchor="middle">
    <text x="445" y="178" fill="#a8b6c4">位7</text><text x="545" y="178" fill="#a8b6c4">位6</text><text x="645" y="178" fill="#a8b6c4">位5</text><text x="745" y="178" fill="#a8b6c4">位4</text>
    <text x="845" y="178" fill="#637080">位3</text><text x="945" y="178" fill="#637080">位2</text><text x="1045" y="178" fill="#637080">位1</text><text x="1145" y="178" fill="#637080">位0</text>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <rect x="395" y="200" width="100" height="78" fill="#3bd16f"/><rect x="495" y="200" width="100" height="78" fill="#3bd16f"/><rect x="595" y="200" width="100" height="78" fill="#ffd166"/><rect x="695" y="200" width="100" height="78" fill="#ffd166"/>
    <rect x="795" y="200" width="100" height="78" fill="#1b232d"/><rect x="895" y="200" width="100" height="78" fill="#1b232d"/><rect x="995" y="200" width="100" height="78" fill="#1b232d"/><rect x="1095" y="200" width="100" height="78" fill="#1b232d"/>
  </g>
  <g font-family="Microsoft YaHei" font-size="27" font-weight="700" text-anchor="middle">
    <text x="445" y="250" fill="#06120a">抢占</text><text x="545" y="250" fill="#06120a">抢占</text><text x="645" y="250" fill="#201700">响应</text><text x="745" y="250" fill="#201700">响应</text>
    <text x="845" y="250" fill="#7a8794">未实现</text><text x="945" y="250" fill="#7a8794">未实现</text><text x="1045" y="250" fill="#7a8794">未实现</text><text x="1145" y="250" fill="#7a8794">未实现</text>
  </g>
  <text x="1235" y="235" fill="#ffffff" font-size="23" font-family="Microsoft YaHei">示例：优先级分组2（GROUP_2）</text>
  <text x="1250" y="270" fill="#a8b6c4" font-size="21" font-family="Microsoft YaHei">2 位抢占 + 2 位响应</text>

  <g font-family="Microsoft YaHei" font-size="22">
    <text x="95" y="360" fill="#ffffff" font-size="24" font-weight="700">硬件抽象层（HAL）分组</text>
    <text x="390" y="360" fill="#62e887" font-size="26" font-weight="700">抢占优先级位</text>
    <text x="680" y="360" fill="#ffd166" font-size="26" font-weight="700">响应/子优先级位</text>
    <text x="1010" y="360" fill="#ffffff" font-size="26" font-weight="700">可用范围</text>
    <text x="95" y="420" fill="#ffffff">NVIC_PRIORITYGROUP_0</text><text x="460" y="420" fill="#62e887">0</text><text x="780" y="420" fill="#ffd166">4</text><text x="1010" y="420" fill="#cbd5df">抢占固定 0；响应 0～15</text>
    <text x="95" y="482" fill="#ffffff">NVIC_PRIORITYGROUP_1</text><text x="460" y="482" fill="#62e887">1</text><text x="780" y="482" fill="#ffd166">3</text><text x="1010" y="482" fill="#cbd5df">抢占 0～1；响应 0～7</text>
    <rect x="70" y="510" width="1460" height="62" rx="8" fill="#14231a" stroke="#62e887" stroke-width="2"/>
    <text x="95" y="551" fill="#ffffff">NVIC_PRIORITYGROUP_2</text><text x="460" y="551" fill="#62e887">2</text><text x="780" y="551" fill="#ffd166">2</text><text x="1010" y="551" fill="#ffffff">抢占 0～3；响应 0～3</text>
    <text x="95" y="625" fill="#ffffff">NVIC_PRIORITYGROUP_3</text><text x="460" y="625" fill="#62e887">3</text><text x="780" y="625" fill="#ffd166">1</text><text x="1010" y="625" fill="#cbd5df">抢占 0～7；响应 0～1</text>
    <text x="95" y="687" fill="#ffffff">NVIC_PRIORITYGROUP_4</text><text x="460" y="687" fill="#62e887">4</text><text x="780" y="687" fill="#ffd166">0</text><text x="1010" y="687" fill="#cbd5df">抢占 0～15；响应固定 0</text>
  </g>
  <line x1="70" y1="382" x2="1530" y2="382" stroke="#6c7b89" stroke-width="2"/>
  <line x1="70" y1="445" x2="1530" y2="445" stroke="#35414d"/><line x1="70" y1="507" x2="1530" y2="507" stroke="#35414d"/><line x1="70" y1="575" x2="1530" y2="575" stroke="#35414d"/><line x1="70" y1="650" x2="1530" y2="650" stroke="#35414d"/><line x1="70" y1="712" x2="1530" y2="712" stroke="#35414d"/>
  <rect x="95" y="750" width="1410" height="86" rx="12" fill="#111a23" stroke="#ffffff" stroke-width="2"/>
  <text x="125" y="786" fill="#62e887" font-size="24" font-family="Microsoft YaHei">抢占优先级：</text><text x="300" y="786" fill="#ffffff" font-size="22" font-family="Microsoft YaHei">决定能否打断正在执行的中断服务程序（ISR）。</text>
  <text x="780" y="786" fill="#ffd166" font-size="24" font-family="Microsoft YaHei">响应优先级：</text><text x="955" y="786" fill="#ffffff" font-size="24" font-family="Microsoft YaHei">只给同抢占级的挂起请求排队。</text>
  <text x="125" y="820" fill="#ff7b72" font-size="22" font-family="Microsoft YaHei">注意：两类优先级都是“数字越小越优先”。</text>
</svg>
