<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950">
<defs><style>.bg{fill:#11171d}.w{stroke:#edf6fb;stroke-width:4;fill:none}.g{stroke:#78e08f;stroke-width:4;fill:none}.y{stroke:#ffd166;stroke-width:4;fill:none}.box{fill:#18232c;stroke:#edf6fb;stroke-width:3;rx:12}.reg{fill:#193523;stroke:#78e08f;stroke-width:3;rx:10}.t{font:22px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#edf6fb}.h{font:700 28px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#fff}.title{font:700 38px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#fff}.s{font:17px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#b8c9d2}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#edf6fb"/></marker><marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78e08f"/></marker></defs>
<rect width="1700" height="950" class="bg"/><text x="850" y="58" text-anchor="middle" class="title">EXTI 单条线路内部逻辑原理图</text>
<rect x="1450" y="370" width="190" height="105" class="box"/><text x="1545" y="414" text-anchor="middle" class="h">输入线 EXTIx</text><text x="1545" y="450" text-anchor="middle" class="s">来自 AFIO_EXTICR 映射</text>
<path d="M1450 422H1360" class="w" marker-end="url(#a)"/>
<rect x="1110" y="315" width="250" height="215" class="box"/><text x="1235" y="360" text-anchor="middle" class="h">边沿检测电路</text><path d="M1320 422H1160" class="w"/><path d="M1160 422V375H1110" class="w"/><path d="M1160 422V475H1110" class="w"/><text x="1130" y="392" class="t">↑ 上升沿脉冲</text><text x="1130" y="493" class="t">↓ 下降沿脉冲</text>
<rect x="1120" y="180" width="210" height="85" class="reg"/><text x="1225" y="215" text-anchor="middle" class="h">RTSR[x]</text><text x="1225" y="248" text-anchor="middle" class="s">上升沿触发选择</text><path d="M1225 265V315" class="g"/>
<rect x="1120" y="585" width="210" height="85" class="reg"/><text x="1225" y="620" text-anchor="middle" class="h">FTSR[x]</text><text x="1225" y="653" text-anchor="middle" class="s">下降沿触发选择</text><path d="M1225 585V530" class="g"/>
<path d="M1110 375H1000V410" class="w"/><path d="M1110 475H1000V435" class="w"/><circle cx="1000" cy="423" r="28" fill="#18232c" stroke="#edf6fb" stroke-width="3"/><text x="1000" y="431" text-anchor="middle" class="h">OR</text>
<rect x="850" y="535" width="190" height="85" class="reg"/><text x="945" y="570" text-anchor="middle" class="h">SWIER[x]</text><text x="945" y="603" text-anchor="middle" class="s">写 1 软件触发</text><path d="M945 535V451H972" class="g"/>
<path d="M972 423H860" class="w" marker-end="url(#a)"/>
<rect x="600" y="335" width="260" height="180" class="box"/><text x="730" y="377" text-anchor="middle" class="h">PR[x] 挂起锁存器</text><rect x="660" y="405" width="140" height="70" class="box"/><text x="730" y="448" text-anchor="middle" class="h">S-R Latch</text><text x="620" y="492" class="s">S：触发脉冲置 1</text><text x="620" y="513" class="s">R：写 1 清除 PR</text><path d="M860 423H800" class="w" marker-end="url(#a)"/>
<rect x="625" y="600" width="210" height="85" class="reg"/><text x="730" y="635" text-anchor="middle" class="h">PR[x] 写 1</text><text x="730" y="668" text-anchor="middle" class="s">清除挂起 W1C</text><path d="M730 600V475" class="g" marker-end="url(#ag)"/>
<path d="M600 423H470" class="w"/>
<rect x="285" y="190" width="190" height="85" class="reg"/><text x="380" y="225" text-anchor="middle" class="h">IMR[x]</text><text x="380" y="258" text-anchor="middle" class="s">1 放行中断请求</text><path d="M380 275V400" class="g"/>
<path d="M470 423H420" class="w"/><path d="M380 400V423H340" class="g"/><path d="M420 395Q370 395 340 423Q370 451 420 451Z" fill="#18232c" stroke="#edf6fb" stroke-width="3"/><text x="383" y="431" text-anchor="middle" class="h">AND</text><path d="M340 423H105" class="w" marker-end="url(#a)"/><text x="110" y="392" class="h">送往 NVIC IRQ</text>
<rect x="285" y="600" width="190" height="85" class="reg"/><text x="380" y="635" text-anchor="middle" class="h">EMR[x]</text><text x="380" y="668" text-anchor="middle" class="s">1 放行事件</text><path d="M972 451H520V710H420" class="y"/><path d="M380 685V710H340" class="g"/><path d="M420 682Q370 682 340 710Q370 738 420 738Z" fill="#18232c" stroke="#ffd166" stroke-width="3"/><text x="383" y="718" text-anchor="middle" class="h">AND</text><path d="M340 710H105" class="y" marker-end="url(#a)"/><text x="110" y="785" class="h">事件 / 唤醒路径</text>
<rect x="545" y="775" width="1100" height="110" class="box"/><text x="1095" y="817" text-anchor="middle" class="t">关键：触发脉冲同时进入挂起锁存与事件支路；IMR 只屏蔽“送往 NVIC”的中断请求，EMR 只控制事件路径。</text><text x="1095" y="855" text-anchor="middle" class="t">PR 记录已经发生的请求，处理后必须写 1 清除；解除屏蔽前若 PR 仍为 1，可能立即进入中断。</text>
</svg>
