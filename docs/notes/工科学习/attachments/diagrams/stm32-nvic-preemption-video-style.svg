<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="aw" markerWidth="13" markerHeight="13" refX="11" refY="5" orient="auto"><path d="M0,0 L0,10 L12,5 z" fill="#ffffff"/></marker><marker id="ag" markerWidth="13" markerHeight="13" refX="11" refY="5" orient="auto"><path d="M0,0 L0,10 L12,5 z" fill="#62e887"/></marker></defs>
  <rect width="1600" height="900" fill="#080b0f"/>
  <rect x="28" y="28" width="1544" height="844" rx="18" fill="#0c1117" stroke="#e8edf2" stroke-width="3"/>
  <text x="800" y="82" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="700" font-family="Microsoft YaHei">抢占优先级与响应优先级：三个中断的执行过程</text>
  <text x="800" y="122" text-anchor="middle" fill="#a8b6c4" font-size="22" font-family="Microsoft YaHei">采用优先级分组2（GROUP_2）；括号写法为（抢占优先级，响应优先级）</text>

  <g font-family="Microsoft YaHei">
    <rect x="90" y="165" width="390" height="95" rx="12" fill="#16202b" stroke="#59a7ff" stroke-width="3"/>
    <text x="120" y="205" fill="#ffffff" font-size="24" font-weight="700">中断A：外部中断（EXTI）（2，0）</text><text x="120" y="238" fill="#a8d2ff" font-size="20">低抢占级，先进入处理器执行</text>
    <rect x="605" y="165" width="390" height="95" rx="12" fill="#14231a" stroke="#62e887" stroke-width="3"/>
    <text x="635" y="205" fill="#ffffff" font-size="24" font-weight="700">中断B：串口（USART）（1，3）</text><text x="635" y="238" fill="#a9f6bd" font-size="20">1 &lt; 2，因此可以抢占 A</text>
    <rect x="1120" y="165" width="390" height="95" rx="12" fill="#2a2515" stroke="#ffd166" stroke-width="3"/>
    <text x="1150" y="205" fill="#ffffff" font-size="24" font-weight="700">中断C：定时器（TIM）（1，0）</text><text x="1150" y="238" fill="#ffe6a0" font-size="20">与 B 同抢占级，不能抢占 B</text>
  </g>

  <line x1="120" y1="355" x2="1500" y2="355" stroke="#ffffff" stroke-width="3" marker-end="url(#aw)"/>
  <text x="80" y="365" fill="#ffffff" font-size="23" font-family="Microsoft YaHei">时间</text>
  <g stroke="#6b7785" stroke-width="2" stroke-dasharray="7 7"><line x1="300" y1="330" x2="300" y2="730"/><line x1="600" y1="330" x2="600" y2="730"/><line x1="900" y1="330" x2="900" y2="730"/><line x1="1200" y1="330" x2="1200" y2="730"/><line x1="1450" y1="330" x2="1450" y2="730"/></g>

  <text x="90" y="430" fill="#ffffff" font-size="22" font-family="Microsoft YaHei">处理器执行状态</text>
  <rect x="300" y="395" width="300" height="70" rx="8" fill="#2468a2" stroke="#a8d2ff" stroke-width="2"/>
  <text x="450" y="438" text-anchor="middle" fill="#ffffff" font-size="25" font-family="Microsoft YaHei">执行 A</text>
  <rect x="600" y="395" width="300" height="70" rx="8" fill="#238b52" stroke="#a9f6bd" stroke-width="2"/>
  <text x="750" y="438" text-anchor="middle" fill="#ffffff" font-size="25" font-family="Microsoft YaHei">B 抢占，执行 B</text>
  <rect x="900" y="395" width="300" height="70" rx="8" fill="#b27b16" stroke="#ffe6a0" stroke-width="2"/>
  <text x="1050" y="438" text-anchor="middle" fill="#ffffff" font-size="25" font-family="Microsoft YaHei">执行 C</text>
  <rect x="1200" y="395" width="250" height="70" rx="8" fill="#2468a2" stroke="#a8d2ff" stroke-width="2"/>
  <text x="1325" y="438" text-anchor="middle" fill="#ffffff" font-size="25" font-family="Microsoft YaHei">恢复 A</text>

  <text x="90" y="535" fill="#ffffff" font-size="25" font-family="Microsoft YaHei">发生的请求</text>
  <line x1="600" y1="490" x2="600" y2="465" stroke="#62e887" stroke-width="5" marker-end="url(#ag)"/>
  <text x="530" y="520" fill="#62e887" font-size="21" font-family="Microsoft YaHei">B 到达</text>
  <line x1="760" y1="565" x2="760" y2="465" stroke="#ffd166" stroke-width="5" marker-end="url(#aw)"/>
  <text x="700" y="595" fill="#ffd166" font-size="21" font-family="Microsoft YaHei">C 到达</text>

  <text x="90" y="650" fill="#ffffff" font-size="25" font-family="Microsoft YaHei">挂起队列</text>
  <rect x="760" y="615" width="140" height="55" rx="8" fill="#2a2515" stroke="#ffd166" stroke-width="2"/>
  <text x="830" y="651" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Microsoft YaHei">C 挂起（Pending）</text>
  <rect x="600" y="680" width="300" height="48" rx="8" fill="#16202b" stroke="#59a7ff" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="750" y="711" text-anchor="middle" fill="#a8d2ff" font-size="21" font-family="Microsoft YaHei">A 被抢占，现场保存在栈中</text>

  <rect x="90" y="765" width="1420" height="78" rx="12" fill="#111a23" stroke="#ffffff" stroke-width="2"/>
  <text x="120" y="799" fill="#62e887" font-size="23" font-family="Microsoft YaHei">① B 的抢占值更小，所以立刻打断 A。</text>
  <text x="580" y="799" fill="#ffd166" font-size="23" font-family="Microsoft YaHei">② C 与 B 抢占值相同，只能等待；B 结束后 C 的响应值 0 比 3 小，因此 C 先于 A。</text>
  <text x="120" y="830" fill="#ffffff" font-size="22" font-family="Microsoft YaHei">口诀：抢占看“能不能插队”；响应看“大家都在等时谁先走”。</text>
</svg>
