<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="930" viewBox="0 0 1700 930">
  <defs><style>.title{font:700 38px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#17364d}.h{font:700 25px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#17364d}.t{font:20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#203744}.s{font:17px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#4b6571}.box{stroke:#315b73;stroke-width:3;rx:16;ry:16}</style></defs>
  <rect width="1700" height="930" fill="#f8fbfd"/><text x="850" y="58" text-anchor="middle" class="title">EXTI 与 NVIC 关键寄存器速查</text>
  <text x="70" y="120" class="h">EXTI：负责“哪条线、什么边沿、是否放行、是否挂起”</text>
  <rect x="65" y="150" width="290" height="210" fill="#e8f4ff" class="box"/><text x="210" y="195" text-anchor="middle" class="h">IMR</text><text x="210" y="235" text-anchor="middle" class="t">Interrupt Mask</text><text x="100" y="280" class="t">bit=1：中断放行</text><text x="100" y="320" class="t">bit=0：中断屏蔽</text><text x="100" y="348" class="s">不负责清 PR</text>
  <rect x="385" y="150" width="290" height="210" fill="#fff1d9" class="box"/><text x="530" y="195" text-anchor="middle" class="h">EMR</text><text x="530" y="235" text-anchor="middle" class="t">Event Mask</text><text x="420" y="280" class="t">bit=1：事件放行</text><text x="420" y="320" class="t">bit=0：事件屏蔽</text><text x="420" y="348" class="s">事件不等同 ISR</text>
  <rect x="705" y="150" width="290" height="210" fill="#e9f8e8" class="box"/><text x="850" y="195" text-anchor="middle" class="h">RTSR / FTSR</text><text x="850" y="235" text-anchor="middle" class="t">Rising / Falling Trigger</text><text x="740" y="280" class="t">RTSR：上升沿触发</text><text x="740" y="320" class="t">FTSR：下降沿触发</text><text x="740" y="348" class="s">可同时启用双边沿</text>
  <rect x="1025" y="150" width="290" height="210" fill="#f1eaff" class="box"/><text x="1170" y="195" text-anchor="middle" class="h">SWIER</text><text x="1170" y="235" text-anchor="middle" class="t">Software Interrupt Event</text><text x="1060" y="280" class="t">写 1 软件触发</text><text x="1060" y="320" class="t">用于测试与软件事件</text><text x="1060" y="348" class="s">行为受屏蔽配置影响</text>
  <rect x="1345" y="150" width="290" height="210" fill="#ffe8ea" class="box"/><text x="1490" y="195" text-anchor="middle" class="h">PR</text><text x="1490" y="235" text-anchor="middle" class="t">Pending Register</text><text x="1380" y="280" class="t">读 1：请求挂起</text><text x="1380" y="320" class="t">写 1：清除挂起</text><text x="1380" y="348" class="s">W1C：绝不能写 0 清除</text>

  <text x="70" y="430" class="h">NVIC：负责“IRQ 是否启用、是否等待、优先级与抢占”</text>
  <rect x="65" y="465" width="290" height="205" fill="#dff2ff" class="box"/><text x="210" y="510" text-anchor="middle" class="h">ISER / ICER</text><text x="210" y="550" text-anchor="middle" class="t">IRQ Enable / Disable</text><text x="100" y="600" class="t">ISER 写 1：使能</text><text x="100" y="638" class="t">ICER 写 1：禁用</text>
  <rect x="385" y="465" width="290" height="205" fill="#e9f8e8" class="box"/><text x="530" y="510" text-anchor="middle" class="h">ISPR / ICPR</text><text x="530" y="550" text-anchor="middle" class="t">IRQ Pending</text><text x="420" y="600" class="t">ISPR：设置挂起</text><text x="420" y="638" class="t">ICPR：清除挂起</text>
  <rect x="705" y="465" width="290" height="205" fill="#fff1d9" class="box"/><text x="850" y="510" text-anchor="middle" class="h">IABR</text><text x="850" y="550" text-anchor="middle" class="t">IRQ Active</text><text x="740" y="600" class="t">读 1：正在执行</text><text x="740" y="638" class="s">Active 不等于 Pending</text>
  <rect x="1025" y="465" width="290" height="205" fill="#f1eaff" class="box"/><text x="1170" y="510" text-anchor="middle" class="h">IPR</text><text x="1170" y="550" text-anchor="middle" class="t">Interrupt Priority</text><text x="1060" y="600" class="t">数值越小优先级越高</text><text x="1060" y="638" class="s">可实现嵌套与抢占</text>
  <rect x="1345" y="465" width="290" height="205" fill="#ffe8ea" class="box"/><text x="1490" y="510" text-anchor="middle" class="h">PRIMASK</text><text x="1490" y="550" text-anchor="middle" class="t">CPU 全局屏蔽</text><text x="1380" y="600" class="t">__disable_irq()</text><text x="1380" y="638" class="s">只用于极短临界区</text>

  <rect x="65" y="735" width="1570" height="130" fill="#ffffff" class="box"/>
  <text x="105" y="780" class="t">典型处理顺序：读取 EXTI_PR 确认线路 → 写 1 清 EXTI_PR → 执行短小处理/置标志 → 异常返回</text>
  <text x="105" y="825" class="t">HAL 路径：EXTIx_IRQHandler → HAL_GPIO_EXTI_IRQHandler(pin) → 清 PR → HAL_GPIO_EXTI_Callback(pin)</text>
  <text x="105" y="855" class="s">提示：NVIC 挂起与 EXTI 挂起是不同层级；屏蔽前后都要考虑残留挂起位，防止刚解除屏蔽就立即进入 ISR。</text>
</svg>
