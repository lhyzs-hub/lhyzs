<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950">
<defs><style>.bg{fill:#11171d}.w{stroke:#eef6fa;stroke-width:4;fill:none}.g{stroke:#7ee29a;stroke-width:4;fill:none}.box{fill:#18232c;stroke:#eef6fa;stroke-width:3;rx:12}.reg{fill:#193523;stroke:#7ee29a;stroke-width:3;rx:10}.t{font:21px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#eef6fa}.h{font:700 27px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#fff}.title{font:700 38px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#fff}.s{font:17px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#b8c9d2}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#eef6fa"/></marker></defs>
<rect width="1700" height="950" class="bg"/><text x="850" y="58" text-anchor="middle" class="title">NVIC 请求、挂起、优先级与嵌套原理图</text>
<rect x="55" y="145" width="230" height="280" class="box"/><text x="170" y="187" text-anchor="middle" class="h">中断请求源</text><text x="90" y="235" class="t">EXTI15_10_IRQn</text><text x="90" y="278" class="t">USART2_IRQn</text><text x="90" y="321" class="t">TIM2_IRQn</text><text x="90" y="364" class="t">DMA1_Channelx</text><text x="90" y="403" class="s">外设状态可同时到来</text>
<path d="M285 280H355" class="w" marker-end="url(#a)"/>
<rect x="355" y="145" width="240" height="280" class="box"/><text x="475" y="188" text-anchor="middle" class="h">Pending 挂起阵列</text><rect x="395" y="220" width="160" height="70" class="reg"/><text x="475" y="263" text-anchor="middle" class="t">ISPR / ICPR</text><text x="390" y="328" class="t">请求到来 → 置位</text><text x="390" y="370" class="t">等待期间不会丢失</text><text x="390" y="405" class="s">每个 IRQ 独立状态位</text>
<path d="M595 280H665" class="w" marker-end="url(#a)"/>
<rect x="665" y="125" width="260" height="320" class="box"/><text x="795" y="170" text-anchor="middle" class="h">使能与全局屏蔽</text><rect x="705" y="205" width="180" height="70" class="reg"/><text x="795" y="247" text-anchor="middle" class="t">ISER / ICER</text><rect x="705" y="300" width="180" height="70" class="reg"/><text x="795" y="342" text-anchor="middle" class="t">PRIMASK / BASEPRI</text><text x="700" y="408" class="s">未使能或被全局屏蔽：</text><text x="700" y="431" class="s">请求可保持 Pending，但不执行</text>
<path d="M925 280H995" class="w" marker-end="url(#a)"/>
<rect x="995" y="115" width="300" height="340" class="box"/><text x="1145" y="160" text-anchor="middle" class="h">优先级仲裁器</text><rect x="1045" y="200" width="200" height="70" class="reg"/><text x="1145" y="242" text-anchor="middle" class="t">IPR 优先级字段</text><text x="1030" y="310" class="t">① 选数值更小者</text><text x="1030" y="350" class="t">② 判断能否抢占当前 ISR</text><text x="1030" y="390" class="t">③ 同级按硬件规则仲裁</text><text x="1030" y="430" class="s">优先级分组决定抢占/子优先级</text>
<path d="M1295 280H1365" class="w" marker-end="url(#a)"/>
<rect x="1365" y="145" width="275" height="280" class="box"/><text x="1503" y="190" text-anchor="middle" class="h">Cortex-M3 CPU</text><text x="1400" y="245" class="t">保存现场 / 压栈</text><text x="1400" y="288" class="t">取向量表入口</text><text x="1400" y="331" class="t">执行 IRQHandler</text><text x="1400" y="374" class="t">异常返回 / 出栈</text>
<rect x="1010" y="545" width="285" height="180" class="box"/><text x="1153" y="590" text-anchor="middle" class="h">Active 活动状态</text><rect x="1055" y="620" width="195" height="60" class="reg"/><text x="1153" y="658" text-anchor="middle" class="t">IABR：正在执行</text><path d="M1503 425V495H1153V545" class="w" marker-end="url(#a)"/>
<rect x="1350" y="555" width="290" height="170" class="box"/><text x="1495" y="600" text-anchor="middle" class="h">高优先级请求到来</text><text x="1390" y="650" class="t">满足抢占条件 → 嵌套</text><text x="1390" y="690" class="s">当前 ISR 暂停，先执行更高优先级</text><path d="M1350 640H1295" class="g"/><path d="M1295 640V455H1225" class="g" marker-end="url(#a)"/>
<rect x="80" y="545" width="800" height="250" class="box"/><text x="480" y="590" text-anchor="middle" class="h">Pending 与 Active 的状态变化</text><text x="120" y="640" class="t">1. 请求到来：Pending=1，Active=0</text><text x="120" y="685" class="t">2. CPU 接受请求：Pending 清除，Active=1</text><text x="120" y="730" class="t">3. ISR 执行期间再次请求：Active=1 且 Pending 可再次置 1</text><text x="120" y="775" class="t">4. 异常返回：Active=0；若仍 Pending，可再次进入 ISR</text>
<rect x="80" y="840" width="1560" height="65" class="box"/><text x="860" y="881" text-anchor="middle" class="t">NVIC 只管理“CPU 是否执行 IRQ”；外设自身的状态位和 EXTI_PR 仍必须按对应外设规则清除。</text>
</svg>
