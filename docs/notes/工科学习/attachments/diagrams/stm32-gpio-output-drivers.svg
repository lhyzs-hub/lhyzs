<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950">
<defs><style>.bg{fill:#11171d}.w{stroke:#eef6fa;stroke-width:4;fill:none}.g{stroke:#79e094;stroke-width:4;fill:none}.box{fill:#18232c;stroke:#eef6fa;stroke-width:3;rx:12}.reg{fill:#193523;stroke:#79e094;stroke-width:3;rx:10}.t{font:21px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#eef6fa}.h{font:700 27px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#fff}.title{font:700 38px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#fff}.s{font:17px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#b8c9d2}</style></defs>
<rect width="1700" height="950" class="bg"/><text x="850" y="58" text-anchor="middle" class="title">GPIO 推挽、开漏与 I²C 共享总线原理图</text>
<rect x="45" y="110" width="760" height="700" class="box"/><text x="425" y="160" text-anchor="middle" class="h">推挽输出 Push-Pull</text><rect x="95" y="225" width="210" height="90" class="reg"/><text x="200" y="262" text-anchor="middle" class="h">ODR / 外设输出</text><text x="200" y="295" text-anchor="middle" class="s">0 或 1</text><path d="M305 270H410" class="g"/>
<text x="555" y="205" class="h">VDD</text><path d="M580 220V290" class="w"/><rect x="485" y="290" width="190" height="105" class="box"/><text x="580" y="332" text-anchor="middle" class="h">P-MOS 上管</text><text x="580" y="367" text-anchor="middle" class="s">输出 1 时导通</text><path d="M580 395V475" class="w"/>
<rect x="485" y="535" width="190" height="105" class="box"/><text x="580" y="577" text-anchor="middle" class="h">N-MOS 下管</text><text x="580" y="612" text-anchor="middle" class="s">输出 0 时导通</text><path d="M580 475V535M580 640V700" class="w"/><path d="M540 700H620M552 718H608M565 736H595" class="w"/>
<circle cx="580" cy="475" r="10" fill="#eef6fa"/><path d="M590 475H735" class="w"/><text x="680" y="455" class="h">PAD</text><path d="M410 270V342H485M410 270V588H485" class="g"/><text x="115" y="420" class="t">输出 1：上管开、下管关 → 主动拉高</text><text x="115" y="465" class="t">输出 0：上管关、下管开 → 主动拉低</text><text x="115" y="510" class="s">两只管不能同时导通，否则形成电源直通。</text>

<rect x="855" y="110" width="800" height="700" class="box"/><text x="1255" y="160" text-anchor="middle" class="h">开漏输出 Open-Drain 与 I²C 线与</text><text x="1465" y="205" class="h">VDD</text><path d="M1490 220V275" class="w"/><polyline points="1460,275 1520,275 1460,300 1520,325 1460,350 1520,375 1490,400" class="w"/><text x="1530" y="325" class="s">外部上拉</text><path d="M1490 400V470H960" class="w"/><text x="980" y="448" class="h">SDA / 共享总线</text>
<rect x="945" y="535" width="190" height="105" class="box"/><text x="1040" y="577" text-anchor="middle" class="h">设备 A 下管</text><text x="1040" y="612" text-anchor="middle" class="s">写 0 时拉低</text><path d="M1040 470V535M1040 640V700" class="w"/><path d="M1000 700H1080M1012 718H1068M1025 736H1055" class="w"/>
<rect x="1295" y="535" width="190" height="105" class="box"/><text x="1390" y="577" text-anchor="middle" class="h">设备 B 下管</text><text x="1390" y="612" text-anchor="middle" class="s">写 0 时拉低</text><path d="M1390 470V535M1390 640V700" class="w"/><path d="M1350 700H1430M1362 718H1418M1375 736H1405" class="w"/>
<rect x="925" y="225" width="220" height="90" class="reg"/><text x="1035" y="262" text-anchor="middle" class="h">A 输出控制</text><text x="1035" y="295" text-anchor="middle" class="s">0=拉低，1=释放</text><path d="M1035 315V535" class="g"/>
<rect x="1280" y="225" width="220" height="90" class="reg"/><text x="1390" y="262" text-anchor="middle" class="h">B 输出控制</text><text x="1390" y="295" text-anchor="middle" class="s">0=拉低，1=释放</text><path d="M1390 315V535" class="g"/>
<text x="900" y="765" class="t">任意设备拉低 → 总线为 0；所有设备释放 → 上拉得到 1。</text>
<rect x="90" y="845" width="1520" height="65" class="box"/><text x="850" y="886" text-anchor="middle" class="t">推挽适合独占信号；开漏适合多个器件共享一根线。开漏“写 1”只是高阻释放，不会主动产生高电平。</text>
</svg>
