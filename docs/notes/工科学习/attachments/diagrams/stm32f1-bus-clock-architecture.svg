<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
<defs><style>.bg{fill:#11171d}.w{stroke:#eef6fa;stroke-width:4;fill:none}.g{stroke:#78e094;stroke-width:4;fill:none}.y{stroke:#ffd166;stroke-width:4;fill:none}.box{fill:#18232c;stroke:#eef6fa;stroke-width:3;rx:12}.clk{fill:#193523;stroke:#78e094;stroke-width:3;rx:10}.t{font:20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#eef6fa}.h{font:700 26px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#fff}.title{font:700 38px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#fff}.s{font:16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#b8c9d2}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#eef6fa"/></marker></defs>
<rect width="1800" height="1000" class="bg"/><text x="900" y="58" text-anchor="middle" class="title">STM32F103 时钟树与 AHB/APB 总线结构</text>
<text x="60" y="115" class="h">时钟产生与分配</text>
<rect x="60" y="150" width="190" height="90" class="clk"/><text x="155" y="188" text-anchor="middle" class="h">HSI 8 MHz</text><text x="155" y="220" text-anchor="middle" class="s">内部 RC</text>
<rect x="60" y="285" width="190" height="90" class="clk"/><text x="155" y="323" text-anchor="middle" class="h">HSE</text><text x="155" y="355" text-anchor="middle" class="s">外部晶体/时钟</text>
<rect x="330" y="240" width="210" height="105" class="clk"/><text x="435" y="280" text-anchor="middle" class="h">PLL 倍频器</text><text x="435" y="318" text-anchor="middle" class="t">F103 常见 ×9</text><path d="M250 195H600M250 330H330M540 292H600" class="g"/>
<polygon points="600,175 740,245 600,315" fill="#18232c" stroke="#eef6fa" stroke-width="4"/><text x="635" y="238" class="h">SYS</text><text x="635" y="270" class="s">时钟选择</text><path d="M740 245H810" class="g" marker-end="url(#a)"/>
<rect x="810" y="195" width="220" height="100" class="clk"/><text x="920" y="235" text-anchor="middle" class="h">SYSCLK</text><text x="920" y="272" text-anchor="middle" class="t">最高 72 MHz</text>
<rect x="1110" y="195" width="220" height="100" class="clk"/><text x="1220" y="235" text-anchor="middle" class="h">AHB 预分频</text><text x="1220" y="272" text-anchor="middle" class="t">产生 HCLK</text><path d="M1030 245H1110" class="g" marker-end="url(#a)"/>
<rect x="1410" y="130" width="300" height="105" class="clk"/><text x="1560" y="172" text-anchor="middle" class="h">APB2 预分频</text><text x="1560" y="210" text-anchor="middle" class="t">PCLK2，最高 72 MHz</text><rect x="1410" y="275" width="300" height="105" class="clk"/><text x="1560" y="317" text-anchor="middle" class="h">APB1 预分频</text><text x="1560" y="355" text-anchor="middle" class="t">PCLK1，最高 36 MHz</text><path d="M1330 245H1365V182H1410M1365 245V327H1410" class="g"/>
<text x="1560" y="420" text-anchor="middle" class="s">APB 分频不为 1 时</text><text x="1560" y="444" text-anchor="middle" class="s">对应定时器时钟通常为 2×PCLK</text>

<text x="60" y="490" class="h">数据与寄存器访问总线</text>
<rect x="60" y="530" width="240" height="150" class="box"/><text x="180" y="575" text-anchor="middle" class="h">Cortex-M3 CPU</text><text x="180" y="615" text-anchor="middle" class="s">ICode / DCode / System</text><text x="180" y="653" text-anchor="middle" class="s">取指、读写数据与外设</text>
<rect x="60" y="735" width="240" height="120" class="box"/><text x="180" y="780" text-anchor="middle" class="h">DMA1</text><text x="180" y="822" text-anchor="middle" class="t">外设 ↔ SRAM 搬运</text>
<rect x="400" y="535" width="300" height="315" class="box"/><text x="550" y="580" text-anchor="middle" class="h">AHB 总线矩阵</text><text x="440" y="630" class="t">Flash 接口</text><text x="440" y="675" class="t">SRAM</text><text x="440" y="720" class="t">DMA</text><text x="440" y="765" class="t">RCC / CRC</text><text x="440" y="810" class="t">AHB→APB 桥</text><path d="M300 605H400M300 795H400" class="w" marker-end="url(#a)"/>
<rect x="800" y="515" width="390" height="170" class="box"/><text x="995" y="560" text-anchor="middle" class="h">APB2 高速外设</text><text x="840" y="608" class="t">AFIO、GPIOA/B/C…、ADC1/2</text><text x="840" y="650" class="t">TIM1、SPI1、USART1</text>
<rect x="800" y="720" width="390" height="175" class="box"/><text x="995" y="762" text-anchor="middle" class="h">APB1 低速外设</text><text x="840" y="807" class="t">TIM2/3/4、USART2/3、I²C1/2</text><text x="840" y="847" class="t">SPI2、USB、CAN、PWR、BKP</text><text x="840" y="878" class="s">具体外设取决于芯片型号与封装</text><path d="M700 620H800M700 780H760V807H800" class="w" marker-end="url(#a)"/>
<rect x="1320" y="545" width="390" height="320" class="box"/><text x="1515" y="590" text-anchor="middle" class="h">一次 GPIO 写操作</text><text x="1360" y="642" class="t">CPU 执行 HAL_GPIO_WritePin</text><text x="1360" y="690" class="t">→ System/AHB 总线</text><text x="1360" y="738" class="t">→ AHB 到 APB2 桥</text><text x="1360" y="786" class="t">→ GPIOx_BSRR 寄存器</text><text x="1360" y="834" class="t">→ 输出驱动改变 PAD 电平</text><path d="M1190 605H1320" class="w" marker-end="url(#a)"/>
<rect x="400" y="920" width="910" height="55" class="box"/><text x="855" y="955" text-anchor="middle" class="s">RCC 既产生/分配时钟，也控制外设时钟门控；未打开 GPIOx 时钟时，寄存器访问不会得到预期硬件行为。</text>
</svg>
