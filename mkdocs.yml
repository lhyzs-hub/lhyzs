site_name: lhyzs
site_url: https://lhyzs-hub.github.io/lhyzs/
theme:
  name: material
  custom_dir: overrides
  favicon: assets/images/avatar.png
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
  palette:
    scheme: slate
    primary: indigo
    accent: amber
  font: false
markdown_extensions:
  - admonition
extra_css:
  - assets/stylesheets/fonts.css
  - assets/stylesheets/core.css
extra_javascript:
  - assets/javascripts/site-v5.js
  - assets/javascripts/supabase-admin-loader.js
nav:
  - 主页: index.md
  - 笔记:
      - 总览: notes/index.md
      - 工科学习: notes/工科学习/index.md
      - 大学课程学习: notes/大学课程学习/index.md
  - 日常: daily/index.md
  - 商店: store/index.md
  - 友链: friends/index.md
