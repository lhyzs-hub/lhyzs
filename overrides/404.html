{% extends "main.html" %}

{% block content %}
  <section
    class="jungle-404"
    data-jungle-runner
    data-sprite="{{ 'assets/images/game/daisy-run-spritesheet-v2.png' | url }}"
    aria-label="404 像素跑酷游戏"
  >
    <canvas
      class="jungle-runner__canvas"
      data-runner-canvas
      width="720"
      height="300"
      tabindex="0"
      aria-label="小菊黑色剪影跑酷。按空格、上方向键、W 或点击画布跳跃。"
    >404</canvas>
    <span class="jungle-runner__sr-status" data-runner-status aria-live="polite">等待开始</span>
  </section>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script src="{{ 'assets/javascripts/not-found-game.js' | url }}" defer></script>
{% endblock %}
